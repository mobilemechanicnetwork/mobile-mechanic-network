<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a mobile mechanic — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f5fa;color:#0f172a}
  main{max-width:660px;margin:4vh auto;padding:24px}
  .banner{width:100%;border-radius:14px;display:block;margin-bottom:20px;box-shadow:0 4px 16px rgba(15,23,42,.08)}
  h1{font-size:1.5rem;color:#0f172a} a{color:#1d4ed8}
  .muted{color:#64748b;font-size:.9rem}
  label{display:block;margin:14px 0 6px;font-size:.9rem;color:#475569;font-weight:600}
  input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;box-sizing:border-box;font-size:1rem}
  textarea{font-family:inherit;resize:vertical}
  .row{display:flex;gap:10px}
  .row > div{flex:1}
  button.primary{width:100%;margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:10px;padding:14px;cursor:pointer;font-size:1.05rem;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.25)}
  .card{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .card h3{margin:0 0 4px;color:#0f172a}
  .tag{display:inline-block;border:1px solid #e2e8f0;background:#f8fafc;border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.8rem;color:#475569}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#475569}
  .badge-fr{background:#052e1b;border-color:#16a34a;color:#86efac}
  .badge-hr{background:#3b2f04;border-color:#d97706;color:#fcd34d}
  .badge-cert{background:#1e1b4b;border-color:#6366f1;color:#c7d2fe}
  .cta{text-align:center;margin:20px 0}
  .cta a button{width:auto;padding:13px 32px;font-size:1.05rem;font-weight:700;background:#2563eb;color:#fff;border:0;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.25)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:999px;cursor:pointer;font-size:.85rem;color:#475569;background:#fff;margin:0;font-weight:600}
  .chip input{accent-color:#2563eb;margin:0;width:auto;flex:none}
  .chip:has(input:checked){border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
</style>
</head>
<body>
<main>
  <img class="banner" src="/header-logo.webp" alt="Mobile Mechanic Network — Connecting drivers and mechanics.">
  <div id="form-view">
    <div id="urgent-banner" hidden style="background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:700">Urgent request — this goes straight to mechanics who accept urgent jobs.</div>
    <h1>Find a mobile mechanic</h1>
    <p class="muted">Tell us what you need. We'll show you independent mobile mechanics in your area.</p>
    <form id="find-form">
      <label for="f-name">Your name</label>
      <input id="f-name" autocomplete="name" required>
      <div class="row">
        <div><label for="f-city">City</label><input id="f-city" required></div>
        <div><label for="f-state">State</label><input id="f-state" required maxlength="2"></div>
        <div><label for="f-zip">ZIP <span class="muted">(optional)</span></label><input id="f-zip" inputmode="numeric" maxlength="10" placeholder="e.g. 70460"></div>
      </div>
      <label for="f-vehicle">Vehicle (year, make, model)</label>
      <input id="f-vehicle" required>
      <label for="f-service">Service needed</label>
      <select id="f-service" required></select>
      <div id="f-diag-symptoms" hidden>
        <label>What symptoms are you having? <span class="muted">(select all that apply)</span></label>
        <div class="chips" id="f-symptom-chips">
          <label class="chip"><input type="checkbox" value="Fluid leak"> Fluid leak</label>
          <label class="chip"><input type="checkbox" value="Dash warning lights on"> Dash warning lights on</label>
          <label class="chip"><input type="checkbox" value="Noise, rattle, or squeak"> Noise, rattle, or squeak</label>
          <label class="chip"><input type="checkbox" value="Won't start"> Won't start</label>
          <label class="chip"><input type="checkbox" value="Vibration"> Vibration</label>
          <label class="chip"><input type="checkbox" value="Unsure — needs mechanic assessment"> Unsure — need a mechanic to assess</label>
        </div>
        <label for="f-moreinfo">Anything else the mechanic should know? <span class="muted">(optional)</span></label>
        <textarea id="f-moreinfo" rows="2" placeholder="Extra details for the mechanic (optional)"></textarea>
      </div>
      <label for="f-date">When do you need it?</label>
      <input id="f-date" type="date" required>
      <button class="primary" type="submit">Find mechanics</button>
    </form>
    <p><a href="/">Back to the home page</a></p>
  </div>
  <div id="results-view" hidden>
    <h1 id="r-head">Mechanics near you</h1>
    <div id="results"></div>
    <div class="cta" id="req-cta" hidden><a id="req-link" href="/request"><button type="button">Request quotes from these mechanics</button></a></div>
    <p><a href="#" id="back">← Change my answers</a> · <a href="/">Home</a></p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SOC_LABELS = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X', website: 'Website' };
const socialLinks = soc => { soc = soc || {}; const links = Object.keys(SOC_LABELS).filter(k => soc[k]).map(k => `<a href="${esc(soc[k])}" target="_blank" rel="noopener">${SOC_LABELS[k]}</a>`); return links.length ? `<div style="margin-top:6px">${links.join(' · ')}</div>` : ''; };
(async () => {
  const d = await (await fetch('/api/services')).json();
  const prompt = document.createElement('option');
  prompt.value = '';
  prompt.textContent = 'Select a service';
  prompt.disabled = true;
  prompt.selected = true;
  $('f-service').appendChild(prompt);
  d.services.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; $('f-service').appendChild(o); });
  const tomorrow = new Date(Date.now() + 86400000);
  $('f-date').value = tomorrow.toISOString().slice(0, 10);
  const isUrgent = new URLSearchParams(location.search).get('urgent') === '1';
  if (isUrgent) {
    $('urgent-banner').hidden = false;
    document.querySelector('#find-form button.primary').textContent = 'Find mechanics now';
  }
  const refreshFindDiag = () => { $('f-diag-symptoms').hidden = $('f-service').value !== 'Diagnostics'; };
  $('f-service').addEventListener('change', refreshFindDiag);
  refreshFindDiag();
})();
$('find-form').onsubmit = async (e) => {
  e.preventDefault();
  const symptoms = Array.from(document.querySelectorAll('#f-symptom-chips input:checked')).map(i => i.value);
  const q = {
    name: $('f-name').value.trim(),
    city: $('f-city').value.trim(),
    state: $('f-state').value.trim(),
    zip: $('f-zip').value.trim(),
    vehicle: $('f-vehicle').value.trim(),
    service: $('f-service').value,
    date: $('f-date').value,
    symptoms: symptoms,
    moreinfo: $('f-moreinfo').value.trim(),
  };
  const params = new URLSearchParams({ city: q.city, state: q.state, service: q.service });
  const d = await (await fetch('/api/mechanics?' + params)).json();
  $('form-view').hidden = true;
  $('results-view').hidden = false;
  $('r-head').textContent = (new URLSearchParams(location.search).get('urgent') === '1' ? 'Urgent — mechanics near ' : 'Mechanics near ') + `${q.city}, ${q.state.toUpperCase()}`;
  const card = m => {
  let badges = '';
  if (m.fastResponder) badges += '<span class="badge badge-fr">Fast Responder</span>';
  if (m.reviewCount >= 3 && m.avgRating >= 4.5) badges += `<span class="badge badge-hr">★ ${m.avgRating} Highly Rated</span>`;
  else if (m.reviewCount > 0) badges += `<span class="badge">★ ${m.avgRating} (${m.reviewCount} review${m.reviewCount === 1 ? '' : 's'})</span>`;
  (m.certifications || []).forEach(c => { badges += `<span class="badge badge-cert">${esc(c)}</span>`; });
  if (badges) badges = `<div class="badges">${badges}</div>`;
  return `<div class="card">${m.coverUrl ? `<div style="margin:-16px -16px 12px;border-radius:10px 10px 0 0;overflow:hidden;max-height:140px"><img src="${esc(m.coverUrl)}" alt="" style="width:100%;display:block;object-fit:cover"></div>` : ''}<h3>${m.logoUrl ? `<img src="${esc(m.logoUrl)}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">` : ''}${esc(m.name)}</h3><div class="muted">${esc(m.city)}, ${esc(m.state)} — ${esc(m.mechanicName)}</div>${badges}${m.phone ? `<div style="margin-top:6px"><a href="tel:${esc(m.phone.replace(/[^+\d]/g, ''))}">Call ${esc(m.phone)}</a></div>` : ''}${socialLinks(m.socials)}${m.promotion ? `<div style="margin-top:8px;border-left:4px solid #2563eb;padding:6px 10px;background:#eff6ff;border-radius:0 8px 8px 0"><strong style="font-size:.85rem">Special:</strong> <strong>${esc(m.promotion.title)}</strong></div>` : ''}<div class="muted">Serves: ${esc([m.city, ...(m.serviceCities || [])].join(', '))}</div><div>${(m.services || []).map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div><div style="margin-top:10px"><a href="/shop.html?id=${esc(m.id)}">View full profile →</a></div></div>`;
  };
  const greet = q.name ? `Thanks, ${esc(q.name)} — here are` : 'Here are';
  $('results').innerHTML = d.mechanics.length
    ? `<p class="muted">${greet} mobile mechanics that serve your area for <strong>${esc(q.service)}</strong>.</p>` + d.mechanics.map(card).join('')
    : `<p class="muted">We are sorry, mobile mechanics in your area coming soon.</p>`;
  if (!d.mechanics.length) $('req-link').querySelector('button').textContent = 'Send a quote request anyway';
  const rp = new URLSearchParams({ service: q.service, vehicle: q.vehicle, city: q.city, state: q.state, date: q.date });
  if (q.zip) rp.set('zip', q.zip);
  if (q.symptoms && q.symptoms.length) rp.set('symptoms', q.symptoms.join('|'));
  if (q.moreinfo) rp.set('moreinfo', q.moreinfo);
  if (new URLSearchParams(location.search).get('urgent') === '1') rp.set('urgent', '1');
  $('req-link').href = '/request?' + rp.toString();
  try { sessionStorage.setItem('mmn_find', JSON.stringify(q)); } catch (e) {}
  $('req-cta').hidden = false;
  window.scrollTo(0, 0);
};
$('back').onclick = (e) => { e.preventDefault(); $('results-view').hidden = true; $('form-view').hidden = false; };
</script>
</body>
</html>
