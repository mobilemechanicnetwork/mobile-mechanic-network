<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in / Create account — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f2f5fa;color:#0f172a}
  main{max-width:440px;margin:5vh auto;padding:24px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .banner{width:100%;border-radius:10px;display:block;margin-bottom:16px}
  p.sub{color:#64748b;margin-top:0}
  .tabs{display:flex;gap:8px;margin:18px 0}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#475569;cursor:pointer;font-weight:600}
  .tabs button.active{background:#2563eb;border-color:#2563eb;color:#fff}
  label{display:block;margin:14px 0 6px;font-size:.9rem;color:#475569;font-weight:600}
  input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;box-sizing:border-box;font-size:1rem}
  button.submit{width:100%;margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:10px;padding:13px;cursor:pointer;font-size:1rem;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.25)}
  .err{color:#dc2626;min-height:1.2em;margin-top:12px;font-size:.9rem}
  .roles{display:flex;gap:8px}
  .roles label{flex:1;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:12px;text-align:center;cursor:pointer;margin:0;color:#475569}
  .roles input{display:none}
  .roles input:checked + span{color:#1d4ed8;font-weight:700}
  .roles label:has(input:checked){background:#eff6ff;border-color:#2563eb}
  .muted{color:#64748b;font-size:.9rem}
  a{color:#1d4ed8}
  .back{text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>
 <div class="card">
  <img class="banner" src="/header-logo.webp" alt="Mobile Mechanic Network — Connecting drivers and mechanics.">
  <p class="sub" id="page-sub">Log in, or create your free account.</p>

  <div class="tabs">
    <button id="tab-login" class="active" type="button">Log in</button>
    <button id="tab-register" type="button">Create account</button>
  </div>

  <form id="form-login">
    <label for="li-email">Email</label>
    <input id="li-email" type="email" required autocomplete="email">
    <label for="li-password">Password</label>
    <input id="li-password" type="password" required autocomplete="current-password">
    <button class="submit" type="submit">Log in</button>
    <div class="err" id="err-login"></div>
  </form>

  <form id="form-register" hidden>
    <label>I am a</label>
    <div class="roles">
      <label><input type="radio" name="role" value="owner" checked><span>Vehicle owner</span></label>
      <label><input type="radio" name="role" value="mechanic"><span>Mobile mechanic</span></label>
    </div>
    <div id="mech-promo" hidden style="margin:12px 0;padding:14px;border:1px solid #2563eb;border-radius:10px;background:#eff6ff">
      <strong>Mobile mechanics: your first 90 days are free.</strong>
      <div class="muted" style="margin-top:6px">No payment information needed during the free trial. After 90 days it's $24.99/month or $200/year. Your account simply pauses until a payment method is added. Cancel anytime.</div>
    </div>
    <label for="rg-name">Full name</label>
    <input id="rg-name" type="text" required autocomplete="name">
    <label for="rg-email">Email</label>
    <input id="rg-email" type="email" required autocomplete="email">
    <label for="rg-password">Password (8+ characters)</label>
    <input id="rg-password" type="password" required minlength="8" autocomplete="new-password">
    <button class="submit" type="submit">Create account</button>
    <div class="err" id="err-register"></div>
  </form>

  <p class="back"><a href="/">Back to the home page</a></p>
 </div>
</main>
<script>
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const formLogin = document.getElementById('form-login');
  const formRegister = document.getElementById('form-register');
  const pageSub = document.getElementById('page-sub');
  function syncSub() {
    const login = !tabRegister.classList.contains('active');
    const mechanic = document.querySelector('input[name="role"]:checked').value === 'mechanic';
    pageSub.textContent = login ? 'Log in, or create your free account.'
      : mechanic ? 'Create your account — first 90 days free.'
      : 'Create your free account.';
  }
  function show(which) {
    const login = which === 'login';    formLogin.hidden = !login; formRegister.hidden = login;
    tabLogin.classList.toggle('active', login); tabRegister.classList.toggle('active', !login);
    syncSub();
  }
  tabLogin.onclick = () => show('login');
  tabRegister.onclick = () => show('register');
  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }
  document.querySelectorAll('input[name="role"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('mech-promo').hidden = document.querySelector('input[name="role"]:checked').value !== 'mechanic';
      syncSub();
    });
  });
  formLogin.onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('err-login'); err.textContent = '';
    try {
      const d = await post('/api/login', { email: document.getElementById('li-email').value, password: document.getElementById('li-password').value });
      location.href = d.user.role === 'mechanic' ? '/mechanic' : '/dashboard';
    } catch (ex) { err.textContent = ex.message; }
  };
  formRegister.onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('err-register'); err.textContent = '';
    try {
      const d = await post('/api/register', {
        name: document.getElementById('rg-name').value,
        email: document.getElementById('rg-email').value,
        password: document.getElementById('rg-password').value,
        role: document.querySelector('input[name="role"]:checked').value,
      });
      location.href = d.user.role === 'mechanic' ? '/mechanic' : '/dashboard';
    } catch (ex) { err.textContent = ex.message; }
  };
</script>
</body>
</html>
