<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
  .page{max-width:720px;margin:24px auto;background:#fff;border-radius:12px;padding:40px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .head{display:flex;gap:16px;align-items:center;border-bottom:2px solid #0f172a;padding-bottom:16px;margin-bottom:16px}
  .head img{width:72px;height:72px;object-fit:cover;border-radius:10px}
  .head h1{margin:0;font-size:1.5rem}
  .head .sub{color:#475569;font-size:.9rem}
  .type{display:inline-block;background:#0f172a;color:#fff;border-radius:6px;padding:4px 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 20px;font-size:.95rem}
  .meta div span{color:#64748b;font-size:.8rem;display:block;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;margin:8px 0 16px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e2e8f0}
  th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
  td.num,th.num{text-align:right}
  .total{text-align:right;font-size:1.3rem;font-weight:700;margin:8px 0}
  .notes{background:#f8fafc;border-radius:8px;padding:12px;font-size:.95rem;margin-top:12px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .photos img{width:100%;height:110px;object-fit:cover;border-radius:8px}
  .disc{background:#f8fafc;border-radius:8px;padding:12px;font-size:.9rem;color:#475569;margin-top:12px}
  .paid{text-align:center;font-weight:700;color:#15803d;font-size:1.1rem;margin:14px 0 4px}
  .foot{margin-top:28px;padding-top:12px;border-top:1px solid #e2e8f0;color:#64748b;font-size:.85rem;text-align:center}
  .actions{text-align:center;margin:16px 0}
  .actions button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 24px;font-size:1rem;cursor:pointer}
  .actions a{color:#2563eb}
  .card{max-width:720px;margin:0 auto 24px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .card button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer;margin:4px 4px 4px 0}
  .card button.ghost{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
  .card button.decline{background:#fff;color:#dc2626;border:1px solid #fecaca}
  .card input,.card textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem;margin:4px 0}
  .card label{font-size:.85rem;color:#475569;font-weight:600}
  .err{color:#dc2626;font-size:.9rem;margin-top:8px}
  .muted{color:#64748b;font-size:.9rem}
  .editbtn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:.95rem;cursor:pointer}
  .meta input{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem}
  @media print{ .actions,.noprint{display:none} body{background:#fff} .page{box-shadow:none;margin:0;max-width:none} .meta .empty-line{display:none} }
</style>
</head>
<body>
<div class="page" id="ticket"><p>Loading…</p></div>
<div id="ticket-actions" class="noprint"></div>
<div class="actions noprint"><a href="/mechanic">← Back to mechanic portal</a> &nbsp; <button onclick="window.print()">Print / Save as PDF</button> <button onclick="window.print()">Share PDF</button></div>
<p class="noprint" style="text-align:center;color:#64748b;font-size:.9rem;margin:0 16px">To share the PDF from your phone: tap Share PDF, then tap Share in the print preview and pick Messages, Mail, or another app.</p>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toFixed(2);
let T = null, B = null;
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function estRows() {
  return [...document.querySelectorAll('#est-rows > div')].map(r => {
    const ins = r.querySelectorAll('input');
    return { desc: ins[0].value, price: ins[1].value };
  });
}
function addEstRow(desc, price) {
  const w = document.getElementById('est-rows');
  if (!w) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0';
  row.innerHTML = `<input placeholder="Description (e.g. Brake pads — parts)" value="${esc(desc || '')}" style="flex:2" aria-label="Estimate line description"><input type="number" min="0.01" step="0.01" placeholder="$" value="${price || ''}" style="flex:1;max-width:110px" aria-label="Estimate line amount"><button type="button" class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  w.appendChild(row);
}
function itemRows() {
  return [...document.querySelectorAll('#edit-items > div')].map(r => {
    const ins = r.querySelectorAll('input');
    return { desc: ins[0].value, qty: ins[1].value, price: ins[2].value };
  });
}
function addItemRow(desc, qty, price) {
  const w = document.getElementById('edit-items');
  if (!w) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0';
  row.innerHTML = `<input placeholder="Description (e.g. Brake pads)" value="${esc(desc || '')}" style="flex:3" aria-label="Line description"><input type="number" placeholder="Qty" min="0" step="1" value="${qty || ''}" style="flex:1;max-width:70px" aria-label="Quantity"><input type="number" placeholder="Price $" min="0" step="0.01" value="${price || ''}" style="flex:1;max-width:110px" aria-label="Price"><button type="button" class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  w.appendChild(row);
}
// Details are editable directly on the ticket itself: the Job address,
// VIN, Mileage, and Payment type lines are inputs as soon as the ticket
// opens, and each one auto-saves when it is filled in.
// Details auto-save: filling a field and moving on (or pressing Enter)
// saves it immediately, with no Save button and no page reload, so the
// mechanic can keep filling the next field.
window.saveDetails = async () => {
  const msg = document.getElementById('details-msg');
  if (msg) { msg.textContent = ''; }
  try {
    let body;
    if (T.type === 'receipt') {
      body = { vin: document.getElementById('dt-vin-in').value, mileage: document.getElementById('dt-mile-in').value, paymentMethod: document.getElementById('dt-pm-in').value, jobAddress: document.getElementById('dt-job-in').value };
    } else {
      body = { customerName: T.customerName, vehicle: T.vehicle, vin: document.getElementById('dt-vin-in').value, mileage: document.getElementById('dt-mile-in').value, items: (T.items || []).map(it => ({ desc: it.desc, qty: it.qty != null ? it.qty : 1, price: it.price != null ? it.price : it.amount })), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: T.notes, warranty: T.warranty, paymentMethod: document.getElementById('dt-pm-in').value, jobAddress: document.getElementById('dt-job-in').value };
    }
    const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not save.');
    if (d.ticket) T = d.ticket;
    if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }
  } catch (e) { if (msg) { msg.style.color = '#dc2626'; msg.textContent = e.message; } else alert(e.message); }
};
window.mechEst = async (action, line) => {
  const verb = action === 'accept' ? 'approved' : 'denied';
  if (!confirm(`Record that the customer ${verb} this ${line === undefined || line === null ? 'estimate' : 'estimate line'} by phone?`)) return;
  const msg = document.getElementById('mech-est-msg');
  if (msg) msg.textContent = '';
  try {
    const body = (line === undefined || line === null) ? {} : { line };
    await api('/api/tickets/' + T.id + '/estimate/' + action, body);
    location.reload();
  } catch (e) { if (msg) msg.textContent = e.message; else alert(e.message); }
};
// Additional comments live at the bottom of the ticket. The editor sits
// at the bottom of the ticket view and auto-saves when the mechanic
// finishes writing, like the detail fields.
function commentsSectionHtml() {
  return `<div style="margin-top:20px;border-top:1px solid #e2e8f0;padding-top:12px">
    <h3 style="margin:0 0 6px">Additional comments</h3>
    <textarea id="ticket-comments" rows="3" placeholder="Anything else about this job...">${esc(T.comments || '')}</textarea>
    <div><span id="comments-msg"></span></div>
    <p class="muted" style="margin:6px 0 0">Saves automatically when you finish writing. Comments show at the bottom of the ticket.</p>
  </div>`;
}
function bindComments() {
  const ta = document.getElementById('ticket-comments');
  if (!ta) return;
  ta.addEventListener('change', async () => {
    const msg = document.getElementById('comments-msg');
    if (msg) msg.textContent = '';
    try {
      const dv = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      let body;
      if (T.type === 'receipt') {
        body = { comments: ta.value };
      } else {
        body = { customerName: T.customerName, vehicle: T.vehicle, vin: dv('dt-vin-in') || T.vin || '', mileage: dv('dt-mile-in') || T.mileage || '', items: (T.items || []).map(it => ({ desc: it.desc, qty: it.qty != null ? it.qty : 1, price: it.price != null ? it.price : it.amount })), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: T.notes, warranty: T.warranty, paymentMethod: dv('dt-pm-in') || T.paymentMethod || '', jobAddress: dv('dt-job-in') || T.jobAddress || '', comments: ta.value };
      }
      const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not save.');
      if (d.ticket) T = d.ticket;
      if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }
    } catch (e) { if (msg) { msg.style.color = '#dc2626'; msg.textContent = e.message; } }
  });
}
// Notes work like Additional comments: an optional editor on the ticket
// view that auto-saves when the mechanic finishes writing. Notes show on
// the ticket document; blank notes show nothing.
function notesSectionHtml() {
  return `<div style="margin-top:20px;border-top:1px solid #e2e8f0;padding-top:12px">
    <h3 style="margin:0 0 6px">Notes (optional)</h3>
    <textarea id="ticket-notes" rows="3" placeholder="Notes about this job (optional)...">${esc(T.notes || '')}</textarea>
    <div><span id="notes-msg"></span></div>
    <p class="muted" style="margin:6px 0 0">Optional. Saves automatically when you finish writing. Notes show on the ticket.</p>
  </div>`;
}
function bindNotes() {
  const ta = document.getElementById('ticket-notes');
  if (!ta) return;
  ta.addEventListener('change', async () => {
    const msg = document.getElementById('notes-msg');
    if (msg) msg.textContent = '';
    try {
      const dv = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const body = { customerName: T.customerName, vehicle: T.vehicle, vin: dv('dt-vin-in') || T.vin || '', mileage: dv('dt-mile-in') || T.mileage || '', items: (T.items || []).map(it => ({ desc: it.desc, qty: it.qty != null ? it.qty : 1, price: it.price != null ? it.price : it.amount })), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: ta.value, warranty: T.warranty, paymentMethod: dv('dt-pm-in') || T.paymentMethod || '', jobAddress: dv('dt-job-in') || T.jobAddress || '' };
      const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not save.');
      if (d.ticket) T = d.ticket;
      if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }
    } catch (e) { if (msg) { msg.style.color = '#dc2626'; msg.textContent = e.message; } }
  });
}
function sendHtml() {
  return `<div class="card" style="margin-top:14px"><h3 style="margin:0 0 6px">Send to customer</h3>
  <p class="muted" style="margin:0 0 8px">Text it to the customer. Customers with an account are also notified in their dashboard automatically. For the PDF, use Share PDF below.</p>
  <p style="margin:0;display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="btn-send-text">Text to customer</button></p>
  <div class="ok" id="send-msg" style="margin-top:8px"></div><div class="err" id="send-err"></div></div>`;
}
function bindSend() {
  const msg = document.getElementById('send-msg'), err = document.getElementById('send-err');
  if (!msg) return;
  const run = async (body) => {
    msg.textContent = ''; err.textContent = '';
    try {
      const d = await api('/api/tickets/' + T.id + '/send', body);
      const parts = [];
      if (body.text) parts.push(d.sent.text === 'sent' ? 'Text sent.' : d.sent.text === 'no-phone' ? 'Text skipped: no phone on file.' : d.sent.text === 'twilio-not-configured' ? 'Text not sent yet: texting is not set up.' : 'Text failed to send.');
      parts.push(d.sent.notified ? 'Dashboard notice sent.' : 'No dashboard notice: customer has no account.');
      msg.textContent = parts.join(' ');
    } catch (e) { err.textContent = e.message; }
  };
  const bt = document.getElementById('btn-send-text'); if (bt) bt.onclick = () => run({ text: true });
}
function fmtTime(t) {
  const m = String(t || '').match(/^(\d{2}):(\d{2})$/);
  if (!m) return String(t || '');
  let h = parseInt(m[1], 10);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + m[2] + ' ' + ap;
}
function calendarCardHtml() {
  return `<div class="card" style="margin-top:14px"><h3 style="margin:0 0 6px">Calendar</h3>
  <div id="cal-state"><p class="muted" style="margin:0">Loading calendar status…</p></div>
  <div class="ok" id="cal-msg" style="margin-top:8px"></div><div class="err" id="cal-err"></div></div>`;
}
async function bindCalendar() {
  const state = document.getElementById('cal-state');
  const msg = document.getElementById('cal-msg'), err = document.getElementById('cal-err');
  if (!state) return;
  let entry = null;
  try {
    const r = await fetch('/api/calendar');
    const d = await r.json();
    entry = (d.entries || []).find(e => e.ticketId === T.id) || null;
  } catch (e) { entry = null; }
  const title = [T.customerName, T.vehicle].filter(Boolean).join(' — ');
  const render = () => {
    if (entry) {
      state.innerHTML = `<p style="margin:0">On your calendar for <strong>${new Date(entry.date + 'T00:00:00').toLocaleDateString()}</strong>${entry.time ? ' at ' + esc(fmtTime(entry.time)) : ''}.</p><p style="margin:8px 0 0"><button type="button" class="ghost" id="btn-cal-remove">Remove from calendar</button></p>`;
      document.getElementById('btn-cal-remove').onclick = async () => {
        msg.textContent = ''; err.textContent = '';
        try {
          const r = await fetch('/api/calendar/' + entry.id, { method: 'DELETE' });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(d.error || 'Remove failed.');
          entry = null; msg.textContent = 'Removed from calendar.'; render();
        } catch (e) { err.textContent = e.message; }
      };
    } else {
      state.innerHTML = `<p class="muted" style="margin:0 0 8px">Add this job to your calendar.</p><p style="margin:0;display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label style="margin:0">Date <input type="date" id="cal-ticket-date"></label><label style="margin:0">Time <input type="time" id="cal-ticket-time"></label><button type="button" id="btn-cal-add">Add to calendar</button></p>`;
      const di = document.getElementById('cal-ticket-date');
      if (window._requestDate) di.value = window._requestDate;
      document.getElementById('btn-cal-add').onclick = async () => {
        msg.textContent = ''; err.textContent = '';
        const date = di.value || '';
        if (!date) { err.textContent = 'Pick a date first.'; return; }
        try {
          const d = await api('/api/calendar', { date, time: document.getElementById('cal-ticket-time').value || '', title, notes: T.label ? ('Ticket ' + T.label) : '', ticketId: T.id });
          entry = d.entry; msg.textContent = 'Added to calendar.'; render();
        } catch (e) { err.textContent = e.message; }
      };
    }
  };
  render();
}

function photoCardHtml() {
  const photos = T.photos || [];
  return `<div style="margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px">
    <h3 style="margin:0 0 6px">Photos</h3>
    <p class="muted" style="margin:0 0 8px">Attach photos to this ticket. They save on the ticket, show in service history, and print/share with the ticket.</p>
    <p><input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp,image/gif"> <button type="button" id="btn-photo-upload">Upload photo</button></p>
    <div class="err" id="photo-msg"></div>
    ${photos.length ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">${photos.map(u => `<div><img src="${esc(u)}" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:8px"><button type="button" class="decline" data-delphoto="${esc(u)}" style="margin-top:4px">Remove</button></div>`).join('')}</div>` : '<p class="muted">No photos yet.</p>'}
  </div>`;
}
function bindPhotos() {
  const up = document.getElementById('btn-photo-upload');
  if (up) up.onclick = async () => {
    const f = document.getElementById('photo-file').files[0];
    const msg = document.getElementById('photo-msg');
    if (!f) { msg.textContent = 'Choose a photo first.'; return; }
    msg.textContent = '';
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await fetch('/api/tickets/' + T.id + '/photo', { method: 'POST', body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Upload failed.');
      location.reload();
    } catch (e) { msg.textContent = e.message; }
  };
  document.querySelectorAll('[data-delphoto]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remove this photo from the ticket?')) return;
      try {
        const r = await fetch('/api/tickets/' + T.id + '/photo', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: b.dataset.delphoto }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Remove failed.');
        location.reload();
      } catch (e) { alert(e.message); }
    };
  });
}
function renderActions() {
  const box = document.getElementById('ticket-actions');
  if (!T) { box.innerHTML = ''; return; }
  if (T.type === 'receipt') {
    // No separate paid note: the receipt document itself already says
    // "Paid in full" with a $0.00 balance.
    box.innerHTML = sendHtml();
    bindSend();
    return;
  }
  let html = '<div class="card">';
  if (T.type === 'estimate') {
    html += `<button type="button" id="btn-edit">Edit lines</button> <button type="button" id="btn-convert">Convert to invoice</button>`;
    html += `<div id="edit-form" hidden style="margin-top:16px">
      <div><label>Customer</label><input id="ed-customer"></div>
      <div><label>Vehicle</label><input id="ed-vehicle"></div>
      <div style="margin-top:10px"><label>Lines</label><div id="edit-items"></div>
      <button type="button" class="ghost" id="btn-add-item">Add line</button></div>
      <div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1"><label>Labor description</label><input id="ed-labor-desc"></div><div style="flex:1"><label>Labor amount</label><input id="ed-labor" type="number" min="0" step="0.01"></div></div>
      <div><label>Tax rate (%)</label><input id="ed-tax" type="number" min="0" max="100" step="0.01"></div>
      <div><label>Notes</label><textarea id="ed-notes" rows="3"></textarea></div>
      <div><label>Warranty</label><textarea id="ed-warranty" rows="2"></textarea></div>
      <button type="button" id="btn-save-edit">Save changes</button> <button type="button" class="ghost" id="btn-cancel-edit">Cancel</button>
      <div class="err" id="edit-msg"></div></div>`;
  }
  if (T.type === 'invoice') {
    if (T.requestId && T.estimateStatus === 'pending') {
      html += `<p style="margin:0 0 10px"><strong>Estimate sent — awaiting customer approval:</strong>${(T.estimateLines || []).map(l => `<div>${esc(l.desc)} — ${money(l.price)}</div>`).join('')}</p><p class="muted" style="margin:0">This invoice cannot be marked paid until the customer decides on the estimate.</p>`;
      html += `<div style="margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px">
        <h3 style="margin:0 0 6px">Customer approved by phone?</h3>
        <p class="muted" style="margin:0 0 8px">If you went over the estimate with the customer on the phone and they approved or denied it, record it here. It works exactly like their approval from the dashboard.</p>
        ${(T.estimateLines || []).map((l, i) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #e2e8f0;align-items:center"><span>${esc(l.desc)} — ${money(l.price)}</span><span style="white-space:nowrap"><button type="button" onclick="mechEst('accept',${i})">Approve</button> <button type="button" class="decline" onclick="mechEst('decline',${i})">Deny</button></span></div>`).join('')}
        <p><button type="button" onclick="mechEst('accept')">Approve all</button> <button type="button" class="decline" onclick="mechEst('decline')">Deny all</button></p>
        <div class="err" id="mech-est-msg"></div>
        ${(T.phoneApprovals || []).length ? `<p class="muted" style="margin:6px 0 0">Recorded by phone: ${(T.phoneApprovals || []).map(pa => `${pa.action === 'accept' ? 'approved' : 'denied'} ${pa.lines.join(', ')} (${money(pa.total)}) on ${new Date(pa.at).toLocaleDateString()}`).join('; ')}</p>` : ''}
      </div>`;
    } else {
      if (T.requestId && window._pendingFu) {
        html += `<p class="muted" style="margin:0 0 8px">A follow-up quote is already pending for this job. You can add estimate lines once the customer has decided on it.</p>`;
      } else if (T.requestId) {
        html += `<h3 style="margin:0 0 6px">Add lines as an estimate</h3><p class="muted" style="margin:0 0 8px">Extra work, sent for customer approval. Approved lines join the invoice; denied lines are never charged.</p>
        <div id="est-rows"></div>
        <button type="button" class="ghost" id="btn-add-est">Add line</button> <button type="button" class="ghost" id="btn-save-est">Save draft</button> <button type="button" id="btn-send-est">Send estimate for approval</button>
        <div class="err" id="est-msg"></div>`;
      }
      html += `<div style="margin-top:14px"><button type="button" id="btn-paid">Mark as paid</button></div>`;
    }
  }
  html += notesSectionHtml();
  html += commentsSectionHtml();
  html += photoCardHtml();
  html += '</div>';
  html += calendarCardHtml();
  html += sendHtml();
  box.innerHTML = html;
  bindNotes();
  bindComments();
  bindPhotos();
  bindSend();
  bindCalendar();
  const editForm = document.getElementById('edit-form');
  if (editForm) {
    document.getElementById('btn-edit').onclick = () => {
      document.getElementById('ed-customer').value = T.customerName || '';
      document.getElementById('ed-vehicle').value = T.vehicle || '';
      document.getElementById('edit-items').innerHTML = '';
      (T.items || []).forEach(it => addItemRow(it.desc, it.qty ?? 1, it.price ?? it.amount));
      if (!(T.items || []).length) addItemRow('', '', '');
      document.getElementById('ed-labor-desc').value = T.laborDesc || '';
      document.getElementById('ed-labor').value = T.laborAmount || '';
      document.getElementById('ed-tax').value = T.taxRate || '';
      document.getElementById('ed-notes').value = T.notes || '';
      document.getElementById('ed-warranty').value = T.warranty || '';
      editForm.hidden = false;
      editForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    document.getElementById('btn-add-item').onclick = () => addItemRow('', '', '');
    document.getElementById('btn-cancel-edit').onclick = () => { editForm.hidden = true; };
    document.getElementById('btn-save-edit').onclick = async () => {
      const msg = document.getElementById('edit-msg');
      msg.textContent = '';
      try {
        const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          customerName: document.getElementById('ed-customer').value,
          vehicle: document.getElementById('ed-vehicle').value,
          vin: T.vin || '',
          mileage: (T.mileage === undefined || T.mileage === null) ? '' : T.mileage,
          items: itemRows(),
          laborDesc: document.getElementById('ed-labor-desc').value,
          laborAmount: document.getElementById('ed-labor').value,
          taxRate: document.getElementById('ed-tax').value,
          notes: document.getElementById('ed-notes').value,
          warranty: document.getElementById('ed-warranty').value
        }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Could not save.');
        location.reload();
      } catch (e) { msg.textContent = e.message; }
    };
    document.getElementById('btn-convert').onclick = async () => {
      let vin = T.vin || '';
      if (!vin) { const el = document.getElementById('dt-vin-in'); if (el) el.focus(); alert('Enter the 17-character VIN in the ticket details above, then try again.'); return; }
      if (!confirm('Convert this estimate to an invoice?')) return;
      try { await api('/api/tickets/' + T.id + '/convert', { vin }); location.reload(); }
      catch (e) { alert(e.message); }
    };
  }
  const estRowsBox = document.getElementById('est-rows');
  if (estRowsBox) {
    (T.estimateStatus === 'draft' ? (T.estimateLines || []) : []).forEach(l => addEstRow(l.desc, l.price));
    document.getElementById('btn-add-est').onclick = () => addEstRow('', '');
    document.getElementById('btn-save-est').onclick = async () => {
      const msg = document.getElementById('est-msg');
      msg.textContent = '';
      try { await api('/api/tickets/' + T.id + '/estimate', { lines: estRows() }); location.reload(); }
      catch (e) { msg.textContent = e.message; }
    };
    document.getElementById('btn-send-est').onclick = async () => {
      const msg = document.getElementById('est-msg');
      msg.textContent = '';
      try { await api('/api/tickets/' + T.id + '/estimate/send', { lines: estRows() }); location.reload(); }
      catch (e) { msg.textContent = e.message; }
    };
  }
  const paidBtn = document.getElementById('btn-paid');
  if (paidBtn) {
    paidBtn.onclick = async () => {
      let vin = T.vin || '';
      if (!vin) { const el = document.getElementById('dt-vin-in'); if (el) el.focus(); alert('Enter the 17-character VIN in the ticket details above, then try again.'); return; }
      let mileage = (T.mileage === undefined || T.mileage === null || T.mileage === '') ? '' : String(T.mileage);
      if (!mileage) { const el = document.getElementById('dt-mile-in'); if (el) el.focus(); alert('Enter the odometer reading in the ticket details above, then try again.'); return; }
      const pm = T.paymentMethod || '';
      if (!pm.trim()) { const el = document.getElementById('dt-pm-in'); if (el) el.focus(); alert('Enter how it was paid in the ticket details above, then try again.'); return; }
      if (!confirm('Mark this invoice as paid via ' + pm.trim() + '? It will become a receipt.')) return;
      try { await api('/api/tickets/' + T.id + '/paid', { paymentMethod: pm.trim(), vin, mileage }); location.reload(); }
      catch (e) { alert(e.message); }
    };
  }
}
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const box = document.getElementById('ticket');
  try {
    const r = await fetch('/api/ticket?id=' + encodeURIComponent(id || ''));
    if (!r.ok) throw new Error('Ticket not found.');
    const d = await r.json();
    T = d.ticket; B = d.business; window._requestDate = d.requestDate || '';
    try { const ib = await (await fetch('/api/requests/inbox')).json(); const bk = (ib.booked || []).find(x => x.ticketId === T.id); window._pendingFu = !!(bk && bk.pendingFollowUp); } catch (e) { window._pendingFu = false; }
    const t = T, b = B;
    const isNew = t.items && t.items.length && t.items[0].qty !== undefined;
    const itemRows = (t.items || []).map(i => isNew
      ? `<tr><td>${esc(i.desc)}</td><td class="num">${esc(i.qty)}</td><td class="num">${money(i.price)}</td><td class="num">${money(i.qty * i.price)}</td></tr>`
      : `<tr><td>${esc(i.desc)}</td><td class="num">${money(i.amount)}</td></tr>`).join('');
    const headRow = isNew
      ? `<tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr>`
      : `<tr><th>Description</th><th class="num">Amount</th></tr>`;
    const laborRow = (t.laborAmount > 0) ? `<tr><td>Labor${t.laborDesc ? ' — ' + esc(t.laborDesc) : ''}</td>${isNew ? '<td class="num"></td><td class="num"></td>' : ''}<td class="num">${money(t.laborAmount)}</td></tr>` : '';
    const taxRow = (t.taxAmount > 0) ? `<tr><td>Tax (${esc(t.taxRate)}%)</td>${isNew ? '<td class="num"></td><td class="num"></td>' : ''}<td class="num">${money(t.taxAmount)}</td></tr>` : '';
    const subRow = (isNew && (t.laborAmount > 0 || t.taxAmount > 0)) ? `<tr><td>Parts subtotal</td><td class="num"></td><td class="num"></td><td class="num">${money(t.subtotal)}</td></tr>` : '';
    box.innerHTML = `
      ${t.type === 'receipt' ? '' : `<div class="noprint" style="text-align:right;margin-bottom:8px;min-height:1.2em"><span id="details-msg"></span></div>`}
      <div class="head">
        ${b && b.logoUrl ? `<img src="${esc(b.logoUrl)}" alt="">` : ''}
        <div><h1>${esc(b ? b.name : 'Mobile mechanic')}</h1>
        <div class="sub">${b ? esc(b.city) + ', ' + esc(b.state) : ''}${b && b.phone ? ' · ' + esc(b.phone) : ''}</div></div>
      </div>
      <div class="type" style="${t.type === 'estimate' ? 'background:#2563eb' : t.type === 'receipt' ? 'background:#16a34a' : 'background:#eab308;color:#422006'}">${esc(t.type)}</div>
      <div class="meta">
        ${t.customerName ? `<div><span>Customer</span>${esc(t.customerName)}</div>` : ''}
        <div><span>Date</span>${new Date(t.createdAt).toLocaleDateString()}</div>
        ${t.vehicle ? `<div><span>Vehicle</span>${esc(t.vehicle)}</div>` : ''}
        ${t.type === 'receipt' ? (t.jobAddress ? `<div><span>Job address</span>${esc(t.jobAddress)}</div>` : '') : `<div class="${t.jobAddress ? '' : 'empty-line'}"><span>Job address</span><input id="dt-job-in" value="${esc(t.jobAddress || '')}" placeholder="Job address"></div>`}
        ${t.type === 'receipt' ? (t.vin ? `<div><span>VIN</span>${esc(t.vin)}</div>` : '') : `<div class="${t.vin ? '' : 'empty-line'}"><span>VIN</span><input id="dt-vin-in" value="${esc(t.vin || '')}" placeholder="VIN"></div>`}
        ${t.type === 'receipt' ? ((t.mileage !== '' && t.mileage != null) ? `<div><span>Mileage</span>${Number(t.mileage).toLocaleString('en-US')} mi</div>` : '') : `<div class="${(t.mileage !== '' && t.mileage != null) ? '' : 'empty-line'}"><span>Mileage</span><input id="dt-mile-in" value="${(t.mileage !== '' && t.mileage != null) ? t.mileage : ''}" placeholder="Mileage" inputmode="numeric"></div>`}
        ${t.type === 'receipt' ? (t.paymentMethod ? `<div><span>Payment type</span>${esc(t.paymentMethod)}</div>` : '') : `<div class="${t.paymentMethod ? '' : 'empty-line'}"><span>Payment type</span><input id="dt-pm-in" value="${esc(t.paymentMethod || '')}" placeholder="e.g. cash, card, check"></div>`}
        <div><span>Ticket</span>${t.label ? esc(t.label) : '#' + esc(t.id.slice(0, 8))}</div>
        ${t.paidAt ? `<div><span>Paid</span>${new Date(t.paidAt).toLocaleDateString()}</div>` : ''}
      </div>
      <table>${headRow}${itemRows}${subRow}${laborRow}${taxRow}</table>
      ${(t.estimateLines && t.estimateLines.length && t.estimateStatus === 'pending') ? `<h3 style="margin-top:16px">Estimate — awaiting approval</h3><table><tr><th>Description</th><th class="num">Amount</th></tr>${t.estimateLines.map(l => `<tr><td>${esc(l.desc)}</td><td class="num">${money(l.price)}</td></tr>`).join('')}</table><div class="muted">These lines are not yet on the invoice. They join it only if the customer approves.</div>` : ''}
      ${(t.deniedLines && t.deniedLines.length) ? `<h3 style="margin-top:16px">Denied repairs (not performed, not charged)</h3><table><tr><th>Description</th><th class="num">Amount</th></tr>${t.deniedLines.map(l => `<tr><td>${esc(l.desc)}</td><td class="num">${money(l.price)}</td></tr>`).join('')}</table><div class="muted">The customer declined these repairs. They are not included in the total.</div>` : ''}
      <div class="total">${t.type === 'estimate' ? 'Estimated total' : 'Total'}: ${money(t.total)}</div>
      ${t.type === 'receipt' && t.paidAt ? `<div class="total">Balance due: $0.00</div><div class="paid">Paid in full. Thank you for your business.</div>` : ''}
      ${t.notes ? `<div class="notes"><strong>Notes:</strong> ${esc(t.notes)}</div>` : ''}
      ${t.warranty ? `<div class="notes"><strong>Warranty:</strong> ${esc(t.warranty)}</div>` : ''}
      ${t.comments ? `<div class="notes"><strong>Additional comments:</strong> ${esc(t.comments)}</div>` : ''}
      ${(t.photos || []).length ? `<h3 style="margin-top:16px">Photos</h3><div class="photos">${t.photos.map(u => `<img src="${esc(u)}" alt="">`).join('')}</div>` : ''}
      ${t.type === 'estimate' ? `<div class="disc">This is an estimate only and is not a final invoice. The work and price listed above are what is quoted. No additional charges will be added without your approval.</div>` : ''}
      <div class="foot">Prepared by ${esc(b ? b.name : '')}${b && b.phone ? ' · ' + esc(b.phone) : ''} · via Mobile Mechanic Network${t.type === 'receipt' ? '<br>This receipt confirms payment received in full for the services listed above.' : ''}</div>`;
    document.title = t.type.charAt(0).toUpperCase() + t.type.slice(1) + ' — ' + (b ? b.name : '');
    ['dt-job-in', 'dt-vin-in', 'dt-mile-in', 'dt-pm-in'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', saveDetails);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    });
    renderActions();
  } catch (e) { box.innerHTML = '<p>' + esc(e.message) + '</p>'; }
})();
</script>
