<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
  .page{max-width:720px;margin:24px auto;background:#fff;border-radius:12px;padding:40px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .head{display:flex;gap:16px;align-items:center;border-bottom:2px solid #0f172a;padding-bottom:16px;margin-bottom:16px}
  .head img{width:72px;height:72px;object-fit:cover;border-radius:10px}
  .head h1{margin:0;font-size:1.5rem}
  .head .sub{color:#475569;font-size:.9rem}
  .type{display:inline-block;background:#0f172a;color:#fff;border-radius:6px;padding:4px 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 20px;font-size:.95rem}
  .meta div span{color:#64748b;font-size:.8rem;display:block;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;margin:8px 0 16px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e2e8f0}
  th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
  td.num,th.num{text-align:right}
  .total{text-align:right;font-size:1.3rem;font-weight:700;margin:8px 0}
  .notes{background:#f8fafc;border-radius:8px;padding:12px;font-size:.95rem;margin-top:12px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .photos img{width:100%;height:110px;object-fit:cover;border-radius:8px}
  .disc{background:#f8fafc;border-radius:8px;padding:12px;font-size:.9rem;color:#475569;margin-top:12px}
  .paid{text-align:center;font-weight:700;color:#15803d;font-size:1.1rem;margin:14px 0 4px}
  .foot{margin-top:28px;padding-top:12px;border-top:1px solid #e2e8f0;color:#64748b;font-size:.85rem;text-align:center}
  .actions{text-align:center;margin:16px 0}
  .actions button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 24px;font-size:1rem;cursor:pointer}
  .actions a{color:#2563eb}
  .card{max-width:720px;margin:0 auto 24px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .card button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer;margin:4px 4px 4px 0}
  .card button.ghost{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
  .card button.decline{background:#fff;color:#dc2626;border:1px solid #fecaca}
  .card input,.card textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem;margin:4px 0}
  .dtwrap{position:relative;display:inline-flex;align-items:center}
  .dtwrap .dtph{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
  .dtwrap.has-val .dtph{display:none}
  .dtwrap:not(.has-val) input::-webkit-datetime-edit{color:transparent}
  @-moz-document url-prefix(){.dtph{display:none}}
  .card label{font-size:.85rem;color:#475569;font-weight:600}
  .err{color:#dc2626;font-size:.9rem;margin-top:8px}
  .muted{color:#64748b;font-size:.9rem}
  .wdetail-text{display:none}
  .editbtn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:.95rem;cursor:pointer}
  .meta input{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem}
  .meta select{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem;background:#fff}
  .newdoc table input{padding:8px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem}
  .newdoc table textarea{padding:8px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem;font-family:inherit}
  .newdoc table input[type="number"]{text-align:right}
  .meta textarea{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;box-sizing:border-box;font-size:.95rem;font-family:inherit}
  textarea.autogrow{resize:none;overflow:hidden;min-height:2.4em}
  @media (max-width:520px){
    .newdoc table td, .newdoc table th{ padding:6px 4px }
    .newdoc table input[data-f="desc"]{ width:118px }
    .newdoc table input[data-f="pdesc"]{ width:118px }
    .newdoc table input[data-f="ldesc"]{ width:118px }
    .newdoc table input[data-f="qty"]{ width:44px !important }
    .newdoc table input[data-f="pqty"]{ width:44px !important }
    .newdoc table input[data-f="lhours"]{ width:44px !important }
    .newdoc table input[data-f="price"]{ width:60px !important }
    .newdoc table input[data-f="pprice"]{ width:60px !important }
    .newdoc table input[data-f="lrate"]{ width:60px !important }
    .newdoc table td > div{ flex-wrap:wrap }
  }
  .newdoc textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem}
  .newdoc button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer}
  .newdoc button.ghost{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
  .cat{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin:12px 0}
  .w100{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem;margin:4px 0}
  .banddots{display:inline-flex;gap:6px;align-items:center;flex:none;margin-left:4px}
  .bdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #cbd5e1;flex:none;padding:0}
  .bdot.red{background:#dc2626}.bdot.yellow{background:#eab308}.bdot.green{background:#16a34a}
  .bdot.sel{border-color:#0f172a;box-shadow:0 0 0 2px #ffffff,0 0 0 4px #0f172a}
  .ppi-legend{font-size:.85rem;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin:8px 0}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
  .dot.red{background:#dc2626}.dot.yellow{background:#eab308}.dot.green{background:#16a34a}
  .ppi-thumb{position:relative;display:inline-block}
  .ppi-thumb img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0}
  .ppi-thumb button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#dc2626;color:#fff;border:0;font-size:12px;line-height:1;cursor:pointer;padding:0;margin:0}
  @media print{ .actions,.noprint{display:none} body{background:#fff} .page{box-shadow:none;margin:0;max-width:none} .meta .empty-line{display:none} .wdetail-text{display:block} }
</style>
</head>
<body>
<div class="page" id="ticket"><p>Loading…</p></div>
<div id="ticket-actions" class="noprint"></div>
<div class="actions noprint" id="ticket-foot-actions"><a href="/mechanic">← Back to mechanic portal</a> &nbsp; <button onclick="window.print()">Print / Save as PDF</button> <button onclick="window.print()">Share PDF</button></div>
<p class="noprint" id="ticket-foot-hint" style="text-align:center;color:#64748b;font-size:.9rem;margin:0 16px">To share the PDF from your phone: tap Share PDF, then tap Share in the print preview and pick Messages, Mail, or another app.</p>
<script src="/vehicle-picker.js"></script>
<script src="/phone-format.js"></script>
<script src="/inspection-cats.js"></script>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toFixed(2);
// Text boxes grow taller to fit their text, so no description is ever
// cut off: every free-text field on the ticket pages is an autogrow
// textarea that wraps and expands as you type.
function autogrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function bindAutogrow(scope) { (scope || document).querySelectorAll('textarea.autogrow').forEach(t => { if (!t.dataset.agBound) { t.dataset.agBound = '1'; t.addEventListener('input', () => autogrow(t)); } if (t.isConnected) autogrow(t); else requestAnimationFrame(() => autogrow(t)); }); }
let T = null, B = null;
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function estRows() {
  return [...document.querySelectorAll('#est-rows > div')].map(r => {
    const ta = r.querySelector('textarea');
    const ins = r.querySelectorAll('input');
    return { desc: ta ? ta.value : ins[0].value, price: ins[0].value };
  });
}
function addEstRow(desc, price) {
  const w = document.getElementById('est-rows');
  if (!w) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0';
  row.innerHTML = `<textarea rows="1" class="autogrow" placeholder="Description (e.g. Brake pads — parts)" style="flex:2" aria-label="Estimate line description">${esc(desc || '')}</textarea><input type="number" min="0.01" step="0.01" placeholder="$" value="${price || ''}" style="flex:1;max-width:110px" aria-label="Estimate line amount"><button type="button" class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  bindAutogrow(row);
  w.appendChild(row);
}
function addExpenseRow(desc, amount) {
  const w = document.getElementById('edit-expenses');
  if (!w) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0';
  row.innerHTML = `<textarea rows="1" class="autogrow" placeholder="Description (e.g. Shop supplies)" style="flex:3" aria-label="Expense description">${esc(desc || '')}</textarea><input type="number" placeholder="Amount" min="0" step="0.01" value="${amount || ''}" style="flex:1" aria-label="Expense amount"><button type="button" class="ghost">×</button>`;
  row.querySelector('button').onclick = () => row.remove();
  bindAutogrow(row);
  w.appendChild(row);
}
function expenseRows() {
  return [...document.querySelectorAll('#edit-expenses > div')].map(r => {
    const ta = r.querySelector('textarea');
    const ins = r.querySelectorAll('input');
    return { desc: ta ? ta.value : ins[0].value, amount: ins[0].value };
  });
}
function itemRows() {
  return [...document.querySelectorAll('#edit-items > div')].map(r => {
    if (r.classList.contains('edit-group')) {
      const main = r.querySelector('.edit-main');
      const desc = (main.querySelector('textarea') || main.querySelector('input')).value;
      const partLines = [...r.querySelectorAll('.edit-part')].map(pr => {
        const ta = pr.querySelector('textarea');
        const ins = pr.querySelectorAll('input');
        return { desc: ta ? ta.value : ins[0].value, qty: ins[0].value, price: ins[1].value };
      }).filter(p => p.desc.trim() && Number(p.qty) > 0);
      const lab = r.querySelector('.edit-labor');
      const labDesc = (lab.querySelector('textarea') || lab.querySelector('input')).value;
      const lins = lab.querySelectorAll('input');
      const laborLine = (labDesc.trim() || Number(lins[0].value) > 0 || Number(lins[1].value) > 0) ? { desc: labDesc, hours: lins[0].value, rate: lins[1].value } : null;
      return { desc, qty: 1, price: 0, partLines, laborLine };
    }
    const ta = r.querySelector('textarea');
    const ins = r.querySelectorAll('input');
    return { desc: ta ? ta.value : ins[0].value, qty: ins[0].value, price: ins[1].value, hours: ins[2].value, parts: ins[3].value };
  });
}
function addItemRow(desc, qty, price, hours, parts) {
  const w = document.getElementById('edit-items');
  if (!w) return;
  const row = document.createElement('div');
  row.className = 'edit-legacy';
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0;flex-wrap:wrap';
  row.innerHTML = `<textarea rows="1" class="autogrow" placeholder="Description (e.g. Brake pads)" style="flex:3;min-width:140px" aria-label="Line description">${esc(desc || '')}</textarea><input type="number" placeholder="Qty" min="0" step="1" value="${qty || ''}" style="flex:1;max-width:70px" aria-label="Quantity"><input type="number" placeholder="Price $" min="0" step="0.01" value="${price || ''}" style="flex:1;max-width:110px" aria-label="Price"><input type="number" placeholder="Labor hrs" min="0" step="any" value="${hours || ''}" style="flex:1;max-width:90px" aria-label="Labor hours"><input type="number" placeholder="Parts" min="0" step="any" value="${parts || ''}" style="flex:1;max-width:70px" aria-label="Parts used"><button type="button" class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  bindAutogrow(row);
  w.appendChild(row);
}
function addEditPartRowTo(g, desc, qty, price) {
  const row = document.createElement('div');
  row.className = 'edit-part';
  row.style.cssText = 'display:flex;gap:8px;margin:6px 0 6px 20px;flex-wrap:wrap';
  row.innerHTML = `<textarea rows="1" class="autogrow" placeholder="Part (e.g. Brake pads)" style="flex:3;min-width:140px" aria-label="Part description">${esc(desc || '')}</textarea><input type="number" placeholder="Qty" min="0" step="1" value="${qty ?? ''}" style="flex:1;max-width:70px" aria-label="Part quantity"><input type="number" placeholder="Price $" min="0" step="0.01" value="${price ?? ''}" style="flex:1;max-width:110px" aria-label="Part price"><button type="button" class="ghost" onclick="this.parentElement.remove()">✕</button>`;
  bindAutogrow(row);
  g.querySelector('.edit-parts').appendChild(row);
}
function addEditPartRow(btn) { addEditPartRowTo(btn.closest('.edit-group'), '', '', ''); }
function addGroupRow(desc, partLines, laborLine) {
  const w = document.getElementById('edit-items');
  if (!w) return;
  const g = document.createElement('div');
  g.className = 'edit-group';
  g.style.cssText = 'border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin:6px 0';
  g.innerHTML = `<div class="edit-main" style="display:flex;gap:8px;margin:6px 0;flex-wrap:wrap"><textarea rows="1" class="autogrow" placeholder="Job (e.g. Front brake Job)" style="flex:3;min-width:140px" aria-label="Job description">${esc(desc || '')}</textarea><button type="button" class="ghost" onclick="this.closest('.edit-group').remove()">✕</button></div>
    <div class="edit-parts"></div>
    <div class="edit-labor" style="display:flex;gap:8px;margin:6px 0 6px 20px;flex-wrap:wrap"><textarea rows="1" class="autogrow" placeholder="Labor (e.g. Brake job labor)" style="flex:3;min-width:140px" aria-label="Labor description">${esc(laborLine ? laborLine.desc : '')}</textarea><input type="number" placeholder="hrs" min="0" step="any" value="${laborLine ? (laborLine.hours ?? '') : ''}" style="flex:1;max-width:90px" aria-label="Labor hours"><input type="number" placeholder="Rate $" min="0" step="0.01" value="${laborLine ? (laborLine.rate ?? '') : ''}" style="flex:1;max-width:110px" aria-label="Labor rate"></div>
    <p style="margin:6px 0 0 20px"><button type="button" class="ghost" onclick="addEditPartRow(this)">+ Add part</button></p>`;
  (partLines || []).forEach(p => addEditPartRowTo(g, p.desc, p.qty, p.price));
  bindAutogrow(g);
  w.appendChild(g);
}
// Full item passthrough for detail auto-saves: grouped children must
// survive a save that only touches the address, VIN, or mileage.
function passItems(items) {
  return (items || []).map(it => ({
    desc: it.desc, qty: it.qty != null ? it.qty : 1, price: it.price != null ? it.price : it.amount,
    hours: it.hours, parts: it.parts,
    partLines: (it.partLines || []).map(p => ({ desc: p.desc, qty: p.qty, price: p.price })),
    laborLine: it.laborLine ? { desc: it.laborLine.desc, hours: it.laborLine.hours, rate: it.laborLine.rate } : null
  }));
}
// Details are editable directly on the ticket itself: the Job address,
// VIN, Mileage, and Payment type lines are inputs as soon as the ticket
// opens, and each one auto-saves when it is filled in.
// Details auto-save: filling a field and moving on (or pressing Enter)
// saves it immediately, with no Save button and no page reload, so the
// mechanic can keep filling the next field.
window.saveDetails = async () => {
  const msg = document.getElementById('details-msg');
  if (msg) { msg.textContent = ''; }
  try {
    let body;
    if (T.type === 'receipt') {
      body = { vin: document.getElementById('dt-vin-in').value, mileage: document.getElementById('dt-mile-in').value, paymentMethod: document.getElementById('dt-pm-in').value, jobAddress: document.getElementById('dt-job-in').value };
    } else {
      body = { customerName: T.customerName, vehicle: T.vehicle, vin: document.getElementById('dt-vin-in').value, mileage: document.getElementById('dt-mile-in').value, items: passItems(T.items), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: T.notes, warranty: T.warranty, paymentMethod: document.getElementById('dt-pm-in').value, jobAddress: document.getElementById('dt-job-in').value, email: (document.getElementById('dt-email-in') ? document.getElementById('dt-email-in').value.trim() : (T.email || '')), expenses: (T.expenses || []).map(e => ({ desc: e.desc, amount: e.amount })) };
    }
    const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not save.');
    if (d.ticket) T = d.ticket;
    if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }
  } catch (e) { if (msg) { msg.style.color = '#dc2626'; msg.textContent = e.message; } else alert(e.message); }
};
window.mechEst = async (action, line) => {
  const verb = action === 'accept' ? 'approved' : 'denied';
  if (!confirm(`Record that the customer ${verb} this ${line === undefined || line === null ? 'estimate' : 'estimate line'} by phone?`)) return;
  const msg = document.getElementById('mech-est-msg');
  if (msg) msg.textContent = '';
  try {
    const body = (line === undefined || line === null) ? {} : { line };
    await api('/api/tickets/' + T.id + '/estimate/' + action, body);
    location.reload();
  } catch (e) { if (msg) msg.textContent = e.message; else alert(e.message); }
};
// Additional comments live at the bottom of the ticket. The editor sits
// at the bottom of the ticket view and auto-saves when the mechanic
// finishes writing, like the detail fields.
function commentsSectionHtml() {
  return `<div style="margin-top:20px;border-top:1px solid #e2e8f0;padding-top:12px">
    <h3 style="margin:0 0 6px">Additional comments</h3>
    <textarea id="ticket-comments" rows="3" class="autogrow" placeholder="Anything else about this job...">${esc(T.comments || '')}</textarea>
    <div><span id="comments-msg"></span></div>
    <p class="muted" style="margin:6px 0 0">Saves automatically when you finish writing. Comments show at the bottom of the ticket.</p>
  </div>`;
}
function bindComments() {
  const ta = document.getElementById('ticket-comments');
  if (!ta) return;
  bindAutogrow(document);
  ta.addEventListener('change', async () => {
    const msg = document.getElementById('comments-msg');
    if (msg) msg.textContent = '';
    try {
      const dv = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      let body;
      if (T.type === 'receipt') {
        body = { comments: ta.value };
      } else {
        body = { customerName: T.customerName, vehicle: T.vehicle, vin: dv('dt-vin-in') || T.vin || '', mileage: dv('dt-mile-in') || T.mileage || '', items: passItems(T.items), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: T.notes, warranty: T.warranty, paymentMethod: dv('dt-pm-in') || T.paymentMethod || '', jobAddress: dv('dt-job-in') || T.jobAddress || '', comments: ta.value, expenses: (T.expenses || []).map(e => ({ desc: e.desc, amount: e.amount })) };
      }
      const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not save.');
      if (d.ticket) T = d.ticket;
      if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }
    } catch (e) { if (msg) { msg.style.color = '#dc2626'; msg.textContent = e.message; } }
  });
}
// Notes work like Additional comments: an optional editor on the ticket
// view that auto-saves when the mechanic finishes writing. Notes show on
// the ticket document; blank notes show nothing.
// Our notes field is one text block, so the count is its non-empty lines.
function notesCount() {
  return String(T.notes || '').split('\n').filter(l => l.trim()).length;
}
function notesSectionHtml() {
  return `<div style="margin-top:20px;border-top:1px solid #e2e8f0;padding-top:12px">
    <h3 style="margin:0 0 6px" id="notes-heading">Notes (${notesCount()})</h3>
    <textarea id="ticket-notes" rows="3" class="autogrow" placeholder="Notes about this job (optional)...">${esc(T.notes || '')}</textarea>
    <div><span id="notes-msg"></span></div>
    <p class="muted" style="margin:6px 0 0">Optional. Saves automatically when you finish writing. Notes show on the ticket.</p>
  </div>`;
}
function bindNotes() {
  const ta = document.getElementById('ticket-notes');
  if (!ta) return;
  bindAutogrow(document);
  ta.addEventListener('change', async () => {
    const msg = document.getElementById('notes-msg');
    if (msg) msg.textContent = '';
    try {
      const dv = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      const body = { customerName: T.customerName, vehicle: T.vehicle, vin: dv('dt-vin-in') || T.vin || '', mileage: dv('dt-mile-in') || T.mileage || '', items: passItems(T.items), laborDesc: T.laborDesc, laborAmount: T.laborAmount, taxRate: T.taxRate, notes: ta.value, warranty: T.warranty, paymentMethod: dv('dt-pm-in') || T.paymentMethod || '', jobAddress: dv('dt-job-in') || T.jobAddress || '', expenses: (T.expenses || []).map(e => ({ desc: e.desc, amount: e.amount })) };
      const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not save.');
      if (d.ticket) T = d.ticket;
      const nh = document.getElementById('notes-heading'); if (nh) nh.textContent = 'Notes (' + notesCount() + ')';
      if (msg) { msg.style.color = '#15803d'; msg.textContent = 'Saved.'; }

function fmtTime(t) {
  const m = String(t || '').match(/^(\d{2}):(\d{2})$/);
  if (!m) return String(t || '');
  let h = parseInt(m[1], 10);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + m[2] + ' ' + ap;
}

async function loadLinkedInsp() {

  for (const r of list) {
    let full = null;
    try { const resp = await fetch('/api/ppi/' + r.id); const d = await resp.json().catch(() => ({})); if (resp.ok) full = d.report || null; } catch (e) {}
    const kindLabel = r.kind === 'complete' ? 'Complete vehicle inspection' : 'Pre-purchase inspection';

        html += `<p class="muted" style="margin:0">No failed or needs-attention items on this inspection.</p>`;

        else html += `<p class="muted" style="margin:0 0 8px">Add repairs from the inspection findings. Each one lands on the ticket for you to price.</p>`;
        const canAdd = !((T.type === 'invoice' && !T.requestId) || (T.type === 'invoice' && T.estimateStatus === 'pending'));
        html += findings.map(c => {
          const pill = c.status === 'fail'

          return `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #e2e8f0;align-items:center"><span>${pill} ${esc(inspFindingSummary(c))}</span>${action}</div>`;
        }).join('');

            const r = await fetch('/api/tickets/' + T.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

        };

}

function newTicketTotals() {

        ${t.customerName ? `<div><span>Customer</span>${esc(t.customerName)}</div>` : ''}
        ${t.phone ? `<div><span>Phone</span>${esc(window.PhoneFmt ? window.PhoneFmt.display(t.phone) : t.phone)}</div>` : ''}
        ${t.type === 'receipt' ? (t.email ? `<div><span>Email</span>${esc(t.email)}</div>` : '') : `<div class="${t.email ? '' : 'empty-line'}"><span>Email</span><input id="dt-email-in" type="email" value="${esc(t.email || '')}" placeholder="Email"></div>`}
        ${t.type === 'receipt' ? (t.jobAddress ? `<div><span>Job address</span>${esc(t.jobAddress)}</div>` : '') : `<div class="${t.jobAddress ? '' : 'empty-line'}"><span>Job address</span><textarea id="dt-job-in" rows="1" class="autogrow" placeholder="Job address">${esc(t.jobAddress || '')}</textarea></div>`}
        <div><span>Date</span>${new Date(t.createdAt).toLocaleDateString()}</div>
        ${t.vehicle ? `<div><span>Vehicle</span>${esc(t.vehicle)}</div>` : ''}
        ${t.type === 'receipt' ? (t.vin ? `<div><span>VIN</span>${esc(t.vin)}</div>` : '') : `<div class="${t.vin ? '' : 'empty-line'}"><span>VIN</span><input id="dt-vin-in" value="${esc(t.vin || '')}" placeholder="VIN"></div>`}
        ${t.type === 'receipt' ? ((t.mileage !== '' && t.mileage != null) ? `<div><span>Mileage</span>${Number(t.mileage).toLocaleString('en-US')} mi</div>` : '') : `<div class="${(t.mileage !== '' && t.mileage != null) ? '' : 'empty-line'}"><span>Mileage</span><input id="dt-mile-in" value="${(t.mileage !== '' && t.mileage != null) ? t.mileage : ''}" placeholder="Mileage" inputmode="numeric"></div>`}
        ${t.type === 'receipt' ? (t.paymentMethod ? `<div><span>Payment type</span>${esc(t.paymentMethod)}</div>` : '') : `<div class="${t.paymentMethod ? '' : 'empty-line'}"><span>Payment type</span><input id="dt-pm-in" value="${esc(t.paymentMethod || '')}" placeholder="e.g. cash, card, check"></div>`}
        <div><span>Ticket</span>${t.label ? esc(t.label) : '#' + esc(t.id.slice(0, 8))}</div>
        ${t.paidAt ? `<div><span>Paid</span>${new Date(t.paidAt).toLocaleDateString()}</div>` : ''}
      </div>
      <table>${headRow}${itemRows}${subRow}${laborRow}${taxRow}${expensesRows}</table>
      <div class="noprint" style="min-height:1.2em"><span id="line-work-msg"></span></div>
      ${(t.estimateLines && t.estimateLines.length && t.estimateStatus === 'pending') ? `<h3 style="margin-top:16px">Estimate — awaiting approval</h3><table><tr><th>Description</th><th class="num">Amount</th></tr>${t.estimateLines.map(l => `<tr><td>${esc(l.desc)}</td><td class="num">${money(l.price)}</td></tr>`).join('')}</table><div class="muted">These lines are not yet on the invoice. They join it only if the customer approves.</div>` : ''}
      ${(t.deniedLines && t.deniedLines.length) ? `<h3 style="margin-top:16px">Denied repairs (not performed, not charged)</h3><table><tr><th>Description</th><th class="num">Amount</th></tr>${t.deniedLines.map(l => `<tr><td>${esc(l.desc)}</td><td class="num">${money(l.price)}</td></tr>`).join('')}</table><div class="muted">The customer declined these repairs. They are not included in the total.</div>` : ''}
      <div class="total">${t.type === 'estimate' ? 'Estimated total' : 'Total'}: ${money(t.total)}</div>
      ${t.type === 'receipt' && t.paidAt ? `<div class="total">Balance due: $0.00</div><div class="paid">Paid in full. Thank you for your business.</div>` : ''}
      ${t.notes ? `<div class="notes"><strong>Notes:</strong> ${esc(t.notes)}</div>` : ''}
      ${t.warranty ? `<div class="notes"><strong>Warranty:</strong> ${esc(t.warranty)}</div>` : ''}
      ${t.comments ? `<div class="notes"><strong>Additional comments:</strong> ${esc(t.comments)}</div>` : ''}
      ${(t.photos || []).length ? `<h3 style="margin-top:16px">Photos</h3><div class="photos">${t.photos.map(u => `<img src="${esc(u)}" alt="">`).join('')}</div>` : ''}
      ${t.type === 'estimate' ? `<div class="disc">This is an estimate only and is not a final invoice. The work and price listed above are what is quoted. No additional charges will be added without your approval.</div>` : ''}
      <div class="foot">Prepared by ${esc(b ? b.name : '')}${b && b.phone ? ' · ' + esc(b.phone) : ''} · via Mobile Mechanic Network${t.type === 'receipt' ? '<br>This receipt confirms payment received in full for the services listed above.' : ''}</div>`;
    document.title = t.type.charAt(0).toUpperCase() + t.type.slice(1) + ' — ' + (b ? b.name : '');
    ['dt-job-in', 'dt-vin-in', 'dt-mile-in', 'dt-pm-in', 'dt-email-in'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', saveDetails);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    });
    renderActions();
    bindLineWorkDetails();
    bindAutogrow(box);
  } catch (e) { box.innerHTML = '<p>' + esc(e.message) + '</p>'; }
})();
</script>
</body>
</html>
