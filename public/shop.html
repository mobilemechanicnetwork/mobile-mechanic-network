<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile mechanic — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f5fa;color:#0f172a}
  main{max-width:760px;margin:0 auto;padding:0 0 40px}
  a{color:#1d4ed8}
  .cover{width:100%;max-height:280px;object-fit:cover;display:block}
  .cover-ph{height:120px;background:linear-gradient(135deg,#dbeafe,#f2f5fa)}
  .body{padding:12px 24px 0}
  .head{display:flex;gap:16px;align-items:flex-end;margin:0 0 12px;position:relative;z-index:1}
  .head img.logo{width:88px;height:88px;object-fit:cover;border-radius:14px;border:3px solid #f2f5fa;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.1);margin-top:-52px;flex:none}
  .head h1{margin:0;font-size:1.6rem;color:#0f172a}
  .muted{color:#64748b;font-size:.92rem}
  .tag{display:inline-block;border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:3px 12px;margin:2px 4px 2px 0;font-size:.85rem;color:#475569}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155}
  .badge-fr{background:#dcfce7;border-color:#16a34a;color:#15803d}
  .badge-hr{background:#fef3c7;border-color:#d97706;color:#b45309}
  .badge-cert{background:#e0e7ff;border-color:#6366f1;color:#4338ca}
  .review{border-top:1px solid #e2e8f0;padding:12px 0}
  .review:first-of-type{border-top:none}
  .stars{color:#f59e0b;letter-spacing:2px}
  .card{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .card h3{margin:0 0 8px;font-size:1.05rem;color:#0f172a}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .btn{display:inline-block;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:1rem;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(37,99,235,.25)}
  .btn.call{background:#16a34a}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .gallery img{width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:pointer}
  .promo{border-left:4px solid #2563eb;padding:8px 12px;background:#eff6ff;border-radius:0 8px 8px 0;margin-top:8px}
  .soc{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .urgent{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:700}
  .back{display:inline-block;margin:16px 24px 0;font-size:.9rem}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:10px}
</style>
</head>
<body>
<main id="page"><p class="body">Loading…</p></main>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" alt=""></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SOC_LABELS = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X', website: 'Website' };
function badgeHtml(b) {
  let h = '';
  if (b.fastResponder) h += '<span class="badge badge-fr">Fast Responder</span>';
  if (b.reviewCount >= 3 && b.avgRating >= 4.5) h += `<span class="badge badge-hr">★ ${b.avgRating} Highly Rated</span>`;
  else if (b.reviewCount > 0) h += `<span class="badge">★ ${b.avgRating} (${b.reviewCount} review${b.reviewCount === 1 ? '' : 's'})</span>`;
  (b.certifications || []).forEach(c => { h += `<span class="badge badge-cert">${esc(c)}</span>`; });
  return h ? `<div class="badges">${h}</div>` : '';
}
async function reviewHtml(businessId) {
  try {
    const d = await (await fetch('/api/reviews?businessId=' + encodeURIComponent(businessId))).json();
    if (!d.reviews.length) return '';
    const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
    return `<div class="card"><h3>Reviews</h3>${d.reviews.map(r => `<div class="review"><div><span class="stars">${stars(r.rating)}</span> <strong>${esc(r.ownerName)}</strong></div>${r.text ? `<p style="margin:6px 0 0">${esc(r.text)}</p>` : ''}<div class="muted" style="font-size:.8rem">${new Date(r.createdAt).toLocaleDateString()}</div></div>`).join('')}</div>`;
  } catch (e) { return ''; }
}
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const page = document.getElementById('page');
  try {
    const r = await fetch('/api/business/public?id=' + encodeURIComponent(id || ''));
    if (!r.ok) throw new Error('Business not found.');
    const { business: b } = await r.json();
    document.title = b.name + ' — Mobile Mechanic Network';
    const soc = b.socials || {};
    const socLinks = Object.keys(SOC_LABELS).filter(k => soc[k]).map(k => `<a href="${esc(String(soc[k]).replace(/"/g, ''))}" target="_blank" rel="noopener">${SOC_LABELS[k]}</a>`).join('');
    const gallery = (b.gallery || []).map(u => `<img src="${esc(u)}" alt="" loading="lazy" onclick="document.getElementById('lightbox-img').src=this.src;document.getElementById('lightbox').style.display='flex'">`).join('');
    page.innerHTML = `
      <a class="back" href="/mechanics">← Back to directory</a>
      ${b.coverUrl ? `<img class="cover" src="${esc(b.coverUrl)}" alt="">` : `<div class="cover-ph"></div>`}
      <div class="body">
        <div class="head">
          ${b.logoUrl ? `<img class="logo" src="${esc(b.logoUrl)}" alt="">` : ''}
          <div><h1>${esc(b.name)}</h1><div class="muted">${esc(b.city)}, ${esc(b.state)}${b.mechanicName ? ' · ' + esc(b.mechanicName) : ''}</div></div>
        </div>
        ${b.acceptUrgent ? `<div><span class="urgent">ACCEPTS URGENT REQUESTS</span></div>` : ''}
        ${badgeHtml(b)}
        <div class="btnrow">
          ${b.phone ? `<a class="btn call" href="tel:${esc(b.phone.replace(/[^+\d]/g, ''))}">Call ${esc(b.phone)}</a>` : ''}
          <a class="btn" href="/request?business=${esc(b.id)}">Request a quote from ${esc(b.name)}</a>
        </div>
        ${b.about ? `<div class="card"><h3>About</h3><p style="margin:0">${esc(b.about)}</p></div>` : ''}
        <div class="card"><h3>Services</h3><div>${(b.services || []).map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div></div>
        <div class="card"><h3>Service area</h3><p class="muted" style="margin:0">${esc([b.city, ...(b.serviceCities || [])].join(', '))}</p></div>
        ${gallery ? `<div class="card"><h3>Photos</h3><div class="gallery">${gallery}</div></div>` : ''}
        ${b.promotion ? `<div class="card"><h3>Current special</h3><div class="promo"><strong>${esc(b.promotion.title)}</strong><div class="muted">${esc(b.promotion.description || '')}${b.promotion.validUntil ? ' · Valid until ' + esc(b.promotion.validUntil) : ''}</div></div></div>` : ''}
        ${b.warranty ? `<div class="card"><h3>Warranty</h3><p style="margin:0">${esc(b.warranty)}</p></div>` : ''}
        <div id="reviews"></div>
        ${socLinks ? `<div class="card"><h3>Follow</h3><div class="soc">${socLinks}</div></div>` : ''}
      </div>`;
    document.getElementById('reviews').innerHTML = await reviewHtml(b.id);
  } catch (e) { page.innerHTML = '<p class="body">' + esc(e.message) + ' <a href="/mechanics">Back to directory</a>.</p>'; }
})();
</script>
</body>
</html>
