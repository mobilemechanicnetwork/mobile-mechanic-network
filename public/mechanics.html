<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a mobile mechanic — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f5fa;color:#0f172a}
  main{max-width:760px;margin:5vh auto;padding:24px}
  h1{font-size:1.5rem;color:#0f172a} a{color:#1d4ed8}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  input,select{padding:10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#0f172a}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  .card{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .card h3{margin:0 0 4px;color:#0f172a} .muted{color:#64748b;font-size:.9rem}
  .tag{display:inline-block;border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.8rem;color:#475569}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155}
  .badge-fr{background:#dcfce7;border-color:#16a34a;color:#15803d}
  .badge-hr{background:#fef3c7;border-color:#d97706;color:#b45309}
  .badge-cert{background:#e0e7ff;border-color:#6366f1;color:#4338ca}
</style>
</head>
<body>
<main>
  <h1>Find a mobile mechanic</h1>
  <p class="muted">Independent mobile mechanics in your area. <a href="/request">Request quotes</a> or <a href="/">back to the home page</a>.</p>
  <div class="row">
    <input id="city" placeholder="City">
    <input id="state" placeholder="State (e.g. LA)" maxlength="2" style="width:130px">
    <select id="service"><option value="">Any service</option></select>
    <button id="search" type="button">Search</button>
  </div>
  <div id="results"></div>
</main>
<script>
  const results = document.getElementById('results');
  async function loadServices() {
    const d = await (await fetch('/api/services')).json();
    const sel = document.getElementById('service');
    d.services.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  }
  const SOC_LABELS = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X', website: 'Website', google: 'Google reviews' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function badgeHtml(b) {
    let h = '';
    if (b.fastResponder) h += '<span class="badge badge-fr">Fast Responder</span>';
    if (b.reviewCount >= 3 && b.avgRating >= 4.5) h += `<span class="badge badge-hr">★ ${b.avgRating} Highly Rated</span>`;
    else if (b.reviewCount > 0) h += `<span class="badge">★ ${b.avgRating} (${b.reviewCount} review${b.reviewCount === 1 ? '' : 's'})</span>`;
    (b.certifications || []).forEach(c => { h += `<span class="badge badge-cert">${esc(c)}</span>`; });
    return h ? `<div class="badges">${h}</div>` : '';
  }
  function socialLinks(soc) {
    soc = soc || {};
    const links = Object.keys(SOC_LABELS).filter(k => soc[k]).map(k => `<a href="${String(soc[k]).replace(/"/g, '')}" target="_blank" rel="noopener">${SOC_LABELS[k]}</a>`);
    return links.length ? `<div style="margin-top:6px">${links.join(' · ')}</div>` : '';
  }
  async function search() {
    const city = document.getElementById('city').value.trim();
    const state = document.getElementById('state').value.trim();
    if (!city || !state) { results.innerHTML = '<p class="muted">Enter your city and state above to see mobile mechanics near you.</p>'; return; }
    const q = new URLSearchParams({ city, state, service: document.getElementById('service').value });
    const d = await (await fetch('/api/mechanics?' + q)).json();
    if (!d.mechanics.length) { results.innerHTML = '<p class="muted">We are sorry, mobile mechanics in your area coming soon.</p><p class="muted">You can still <a href="/request">request quotes</a> and mechanics will be able to quote as they join.</p>'; return; }
    results.innerHTML = d.mechanics.map(m => `<div class="card">${m.coverUrl ? `<div style="margin:-16px -16px 12px;border-radius:10px 10px 0 0;overflow:hidden;max-height:160px"><img src="${m.coverUrl}" alt="" style="width:100%;display:block;object-fit:cover"></div>` : ''}<h3>${m.logoUrl ? `<img src="${m.logoUrl}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">` : ''}${m.name}</h3><div class="muted">${m.city}, ${m.state} — ${m.mechanicName}</div>${badgeHtml(m)}${m.phone ? `<div style="margin-top:6px"><a href="tel:${m.phone.replace(/[^+\d]/g, '')}">Call ${m.phone}</a></div>` : ''}${socialLinks(m.socials)}${m.promotion ? `<div style="margin-top:8px;border-left:4px solid #2563eb;padding:6px 10px;background:#eff6ff;border-radius:0 8px 8px 0"><strong style="font-size:.85rem">Special:</strong> <strong>${m.promotion.title}</strong><div class="muted" style="font-size:.82rem">${m.promotion.description}${m.promotion.validUntil ? ' · ' + m.promotion.validUntil : ''}</div></div>` : ''}<div class="muted">Serves: ${[m.city, ...(m.serviceCities || [])].join(', ')}</div><p>${m.about || ''}</p><div>${m.services.map(s => `<span class="tag">${s}</span>`).join('')}</div><div style="margin-top:10px"><a href="/shop.html?id=${m.id}">View full profile →</a></div></div>`).join('');
  }
  document.getElementById('search').onclick = search;
  loadServices();
  results.innerHTML = '<p class="muted">Enter your city and state above to see mobile mechanics near you.</p>';
</script>
</body>
</html>
