<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a mobile mechanic — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8eef7}
  main{max-width:760px;margin:5vh auto;padding:24px}
  h1{font-size:1.5rem} a{color:#93c5fd}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  input,select{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f1a2e;color:#fff}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
  .card{border:1px solid #334155;border-radius:10px;padding:16px;margin:12px 0;background:#0f1a2e}
  .card h3{margin:0 0 4px} .muted{color:#9fb3c8;font-size:.9rem}
  .tag{display:inline-block;border:1px solid #334155;border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.8rem;color:#c7d5e8}
</style>
</head>
<body>
<main>
  <h1>Find a mobile mechanic</h1>
  <p class="muted">Independent mobile mechanics in your area. <a href="/request">Request quotes</a> or <a href="/">back to the home page</a>.</p>
  <div class="row">
    <input id="city" placeholder="City">
    <input id="state" placeholder="State (e.g. LA)" maxlength="2" style="width:130px">
    <select id="service"><option value="">Any service</option></select>
    <button id="search" type="button">Search</button>
  </div>
  <div id="results"></div>
</main>
<script>
  const results = document.getElementById('results');
  async function loadServices() {
    const d = await (await fetch('/api/services')).json();
    const sel = document.getElementById('service');
    d.services.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  }
  async function search() {
    const q = new URLSearchParams({ city: document.getElementById('city').value.trim(), state: document.getElementById('state').value.trim(), service: document.getElementById('service').value });
    const d = await (await fetch('/api/mechanics?' + q)).json();
    if (!d.mechanics.length) { results.innerHTML = '<p class="muted">No mobile mechanics found there yet. Try a nearby city, or request quotes and mechanics in your state can still respond where they serve.</p>'; return; }
    results.innerHTML = d.mechanics.map(m => `<div class="card">${m.coverUrl ? `<div style="margin:-16px -16px 12px;border-radius:10px 10px 0 0;overflow:hidden;max-height:160px"><img src="${m.coverUrl}" alt="" style="width:100%;display:block;object-fit:cover"></div>` : ''}<h3>${m.logoUrl ? `<img src="${m.logoUrl}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">` : ''}${m.name}</h3><div class="muted">${m.city}, ${m.state} — ${m.mechanicName}</div>${m.phone ? `<div style="margin-top:6px"><a href="tel:${m.phone.replace(/[^+\d]/g, '')}">Call ${m.phone}</a></div>` : ''}${m.promotion ? `<div style="margin-top:8px;border-left:4px solid #2563eb;padding:6px 10px;background:#0b1e3a;border-radius:0 8px 8px 0"><strong style="font-size:.85rem">Special:</strong> <strong>${m.promotion.title}</strong><div class="muted" style="font-size:.82rem">${m.promotion.description}${m.promotion.validUntil ? ' · ' + m.promotion.validUntil : ''}</div></div>` : ''}<div class="muted">Serves: ${[m.city, ...(m.serviceCities || [])].join(', ')}</div><p>${m.about || ''}</p><div>${m.services.map(s => `<span class="tag">${s}</span>`).join('')}</div></div>`).join('');
  }
  document.getElementById('search').onclick = search;
  loadServices().then(search);
</script>
</body>
</html>
