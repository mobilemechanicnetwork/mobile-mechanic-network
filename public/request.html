<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request quotes — Mobile Mechanic Network</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8eef7}
  main{max-width:520px;margin:5vh auto;padding:24px}
  h1{font-size:1.5rem} a{color:#93c5fd}
  label{display:block;margin:14px 0 6px;font-size:.9rem;color:#c7d5e8}
  input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f1a2e;color:#fff;box-sizing:border-box}
  button{width:100%;margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:1rem}
  .err{color:#fca5a5;min-height:1.2em;margin-top:12px;font-size:.9rem}
  .ok{color:#86efac;margin-top:12px}
  .muted{color:#9fb3c8}
</style>
</head>
<body>
<main>
  <h1>Request quotes</h1>
  <p class="muted">Describe the job once. Mobile mechanics in your area who offer that service can send you a quote. Your street address stays private until you accept a quote.</p>
  <form id="form">
    <label for="service">Service</label>
    <select id="service" required></select>
    <label for="vehicle">Vehicle (year, make, model)</label>
    <input id="vehicle" required placeholder="2019 Ford F-150">
    <div id="my-vehicles-row" style="margin-top:6px" hidden><label for="my-vehicles" style="margin-top:0">Or pick one of your saved vehicles</label><select id="my-vehicles"><option value="">Choose…</option></select></div>
    <label for="city">City</label>
    <input id="city" required>
    <label for="state">State</label>
    <input id="state" required maxlength="2" placeholder="LA">
    <label for="description">What is going on with the vehicle?</label>
    <textarea id="description" rows="4" required></textarea>
    <label for="phone">Phone number (mechanics reach you here)</label>
    <input id="phone" type="tel" required autocomplete="tel">
    <button type="submit">Send request</button>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </form>
  <p><a href="/dashboard">My dashboard</a> · <a href="/mechanics">Browse mechanics</a> · <a href="/">Home</a></p>
</main>
<script>
  const err = document.getElementById('err'), ok = document.getElementById('ok');
  (async () => {
    const me = await (await fetch('/api/me')).json().catch(() => ({}));
    if (!me.user) { location.href = '/account'; return; }
    if (me.user.role !== 'owner') { err.textContent = 'Quote requests use a vehicle owner account.'; document.querySelector('button[type=submit]').disabled = true; return; }
    const d = await (await fetch('/api/services')).json();
    const sel = document.getElementById('service');
    d.services.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    if (me.user.phone) document.getElementById('phone').value = me.user.phone;
    const v = await (await fetch('/api/vehicles/me')).json().catch(() => ({}));
    if (v.vehicles && v.vehicles.length) {
      const vsel = document.getElementById('my-vehicles');
      v.vehicles.forEach(x => { const o = document.createElement('option'); o.value = `${x.year} ${x.make} ${x.model}`; o.textContent = o.value; vsel.appendChild(o); });
      document.getElementById('my-vehicles-row').hidden = false;
      vsel.onchange = () => { if (vsel.value) document.getElementById('vehicle').value = vsel.value; };
    }
  })();
  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault(); err.textContent = ''; ok.textContent = '';
    const body = { service: document.getElementById('service').value, vehicle: document.getElementById('vehicle').value, city: document.getElementById('city').value, state: document.getElementById('state').value, description: document.getElementById('description').value, phone: document.getElementById('phone').value };
    const r = await fetch('/api/requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = d.error || 'Something went wrong.'; return; }
    ok.textContent = d.mechanicsNotified > 0 ? `Request sent. ${d.mechanicsNotified} mobile mechanic(s) in your area can quote it. Watch your dashboard for quotes.` : 'Request sent. No mechanics in your area match yet, but your request is posted and will match as mechanics join.';
    e.target.reset();
  };
</script>
</body>
</html>
